<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#2346d8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fdc6e"/>
      <stop offset="1" stop-color="#1fa846"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a52"/>
      <stop offset="1" stop-color="#d9261f"/>
    </linearGradient>
    <!-- One spike: flat, a sharp peak, a deeper trough, then a slow recovery. -->
    <path id="spike" d="M0 24C5 24 8 24 10 22.5C12.5 20.5 13.5 1 16 1C18.5 1 19.5 34 23.5 34C27 34 30 26 38 25"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="11" fill="#18181b" stroke="#fff" stroke-width="2.5"/>
  <g transform="translate(32 32) scale(0.9) translate(-31 -30)">
    <g transform="translate(6 8)">
      <use href="#spike" stroke="#fff" stroke-width="7"/>
      <use href="#spike" stroke="url(#blue)" stroke-width="4"/>
    </g>
    <g transform="translate(12 14)">
      <use href="#spike" stroke="#fff" stroke-width="7"/>
      <use href="#spike" stroke="url(#green)" stroke-width="4"/>
    </g>
    <g transform="translate(18 20)">
      <use href="#spike" stroke="#fff" stroke-width="7"/>
      <use href="#spike" stroke="url(#red)" stroke-width="4"/>
    </g>
  </g>
</svg>
